<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#121212;color:#E4E4E4;overflow:hidden}
body{font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;padding:72px 84px 0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:20px;letter-spacing:.08em;color:#7CA9FF;text-transform:uppercase}
h1{margin-top:30px;font-size:92px;font-weight:800;line-height:1.1;letter-spacing:-0.03em}
.ul{background:linear-gradient(rgba(124,169,255,.26),rgba(124,169,255,.26)) no-repeat 0 80%/100% .26em}
.stats{position:absolute;left:84px;right:84px;top:448px;display:flex;gap:64px;list-style:none}
.num{font-size:44px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.num em{font-style:normal;color:#7CA9FF}
.lab{margin-top:12px;font-size:17px;line-height:1.55;color:rgba(255,255,255,.52)}
</style></head><body>
<p class="eyebrow">Park Sungjin — Full-stack · AI</p>
<h1>사용자 문제를<br><span class="ul">제품으로</span> 해결합니다</h1>
<ul class="stats">
<li><b class="num"><em>1,500+</em></b><p class="lab">교내 공지 서비스<br>3개월 방문자</p></li>
<li><b class="num">상위 <em>약 4.5%</em></b><p class="lab">LG Aimers 9기<br>1,082팀 중 49위</p></li>
<li><b class="num">교내 <em>1위</em></b><p class="lab">TOPCIT 2026<br>Level 4</p></li>
<li><b class="num"><em>ICLR</em> 2027</b><p class="lab">투고 논문 공저<br>심사 중</p></li>
</ul>
</body></html>
