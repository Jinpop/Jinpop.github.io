<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#121212;color:#E4E4E4;overflow:hidden}
body{font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;padding:72px 84px 0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:20px;letter-spacing:.08em;color:#7CA9FF;text-transform:uppercase}
h1{margin-top:22px;font-size:68px;font-weight:800;line-height:1.1;letter-spacing:-0.03em}
.ul{background:linear-gradient(rgba(124,169,255,.26),rgba(124,169,255,.26)) no-repeat 0 80%/100% .26em}
.stats{position:absolute;left:84px;right:84px;top:448px;display:flex;gap:56px;list-style:none}
.num{font-size:44px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.num em{font-style:normal;color:#7CA9FF}
.num .arr{margin:0 .06em;font-weight:500;color:rgba(255,255,255,.52)}
.lab{margin-top:12px;font-size:17px;line-height:1.55;color:rgba(255,255,255,.52)}
</style></head><body>
<p class="eyebrow">Park Sungjin — AI Engineer, RAG / LLM</p>
<h1>실제 사용자 데이터로<br>AI 시스템의 <span class="ul">문제를</span><br>찾고 개선합니다</h1>
<ul class="stats">
<li><b class="num"><em>2,000+</em></b><p class="lab">교내 공지 서비스<br>누적 방문자</p></li>
<li><b class="num">45.5<span class="arr">→</span><em>80.1%</em></b><p class="lab">RAG 검색 정확도 개선<br>사용자 기반 질문 Hit@1</p></li>
<li><b class="num">상위 <em>약 4.5%</em></b><p class="lab">LG Aimers 9기 예선<br>1,087팀 중 49위</p></li>
</ul>
</body></html>
